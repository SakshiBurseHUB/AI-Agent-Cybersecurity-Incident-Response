<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}AI Security Operations Center{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="wrapper">

    <!-- ==========================================
         Sidebar
    =========================================== -->

    <aside class="sidebar">

        <div class="logo">

    <h3>
        <i class="bi bi-shield-lock-fill"></i>
        AI SOC
    </h3>

    <p class="logo-subtitle">
        Security Operations Center
    </p>

</div>

            <small>

                Security Operations Center

            </small>

        </div>

        <ul class="menu">

           <li>

    <a href="/" class="active">

        <i class="bi bi-speedometer2"></i>

        Dashboard

    </a>

</li>

            <li>

                <a href="/incidents">

                    <i class="bi bi-shield-exclamation"></i>

                    Incidents

                </a>

            </li>

            <li>

                <a href="/reports">

                    <i class="bi bi-file-earmark-bar-graph"></i>

                    Reports

                </a>

            </li>

            <li>

                <a href="/settings">

                    <i class="bi bi-gear"></i>

                    Settings

                </a>

            </li>

        </ul>
        <div class="sidebar-footer">

    <div class="analyst-card">

        <i class="bi bi-person-circle"></i>

        <div>

            <strong>SOC Analyst</strong>

            <small>Administrator</small>

        </div>

    </div>

</div>

    </aside>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <div class="content">

        <!-- ==========================================
             Top Navigation
        =========================================== -->

        <nav class="topbar">

    <div class="topbar-left">

        <h4 class="dashboard-title">

            AI Security Operations Center

        </h4>

        <small id="currentDate"></small>

    </div>

    <div class="topbar-right">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                class="form-control"
                placeholder="Search incidents...">

        </div>

        <div class="clock">

            <i class="bi bi-clock"></i>

            <span id="currentTime"></span>

        </div>

        <span class="badge bg-success system-status">

            <i class="bi bi-check-circle-fill"></i>

            System Online

        </span>

        <button class="notification-btn">

            <div class="notification-wrapper">

    <i class="bi bi-bell fs-4"></i>

    <span
        id="notificationCount"
        class="notification-badge">

        0

    </span>

</div>

        </button>

        <div class="user-profile">

            <i class="bi bi-person-circle user-icon"></i>

            <div>

                <strong>

                    SOC Analyst

                </strong>

                <br>

                <small>

                    Administrator

                </small>

            </div>

        </div>

        <button class="btn btn-outline-danger logout-btn">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </button>

    </div>

</nav>

        <!-- ==========================================
             Main Content
        =========================================== -->

        <main>

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Dashboard JS -->

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
